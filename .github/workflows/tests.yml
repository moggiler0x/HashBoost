name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  mac-launcher:
    # Скрипт запуска для Mac сам готовит окружение с нуля и запускает программу
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/HashBoost-mac.command --version
      - run: ./scripts/HashBoost-mac.command --version  # повторный запуск без переустановки
